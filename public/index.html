
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1425">
  <title>Bank Security Lab | Security Center</title>
<style>
  
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
  --bg: #08111f;
  --surface: #101e32;
  --surface-2: #162842;
  --border: #263d5b;
  --blue: #38a5ff;
  --text: #edf5ff;
  --muted: #9aadc5;
  --green: #45d6a0;
  --amber: #ffc46b;
  --red: #ff6b7a;
}

body {
  margin: 0;
  padding: 16px;
  background:
    radial-gradient(ellipse at top, #142d4c 0%, transparent 48%),
    var(--bg);
  color: var(--text);
  font-family: Inter, Arial, sans-serif;
  line-height: 1.6;
}

main {
  max-width: 1050px;
  margin: 20px auto;
}

h1 {
  color: #70baff;
  font-size: clamp(26px, 5vw, 36px);
  letter-spacing: -1px;
  margin-bottom: 4px;
}

h2 {
  font-size: 19px;
  color: #dcecff;
  margin-top: 0;
}

h3 {
  color: #a8d4ff;
}

main > p.muted {
  margin-top: 0;
  margin-bottom: 26px;
}

.panel {
  background: linear-gradient(145deg, #14243a, #0f1c30);
  padding: 22px;
  border-radius: 16px;
  margin: 18px 0;
  border: 1px solid var(--border);
  box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
}

.panel h2 {
  padding-bottom: 13px;
  border-bottom: 1px solid #263d5b;
}

button {
  background: linear-gradient(135deg, #1685ed, #2865d9);
  color: white;
  border: 1px solid #4598f3;
  padding: 13px 18px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin: 5px 3px 5px 0;
  min-height: 44px;
  transition: filter .2s ease;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.delete {
  background: #8d2e43;
  border-color: #b34b60;
}

input,
textarea,
select {
  width: 100%;
  padding: 13px;
  margin: 7px 0 15px;
  border-radius: 9px;
  border: 1px solid #354d6c;
  background: #091629;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(56, 165, 255, .13);
}

textarea {
  min-height: 100px;
  resize: vertical;
}

label {
  display: block;
  color: #c5d8ee;
  font-size: 13px;
  font-weight: 600;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #a9d5ff;
  font-size: 13px;
  line-height: 1.7;
  background: #081321;
  border: 1px solid #263d5b;
  border-radius: 10px;
  padding: 15px;
  overflow-x: auto;
}

.muted {
  color: var(--muted);
  font-size: 14px;
}

.status {
  color: var(--green);
  font-weight: bold;
}

.warning {
  color: var(--amber);
}

.incident {
  background: #0b192b;
  border: 1px solid #2b4565;
  border-radius: 12px;
  padding: 16px;
  margin: 13px 0;
}

.incident h3 {
  margin-top: 0;
  color: #8bc5ff;
}

.incident-meta {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
}

.empty {
  padding: 20px;
  border: 1px dashed #405574;
  border-radius: 10px;
  color: var(--muted);
  text-align: center;
}

.notice {
  background: #2a2a25;
  border-left: 4px solid var(--amber);
  padding: 13px;
  border-radius: 7px;
  color: #f0d9ae;
  font-size: 13px;
  margin: 14px 0;
}

hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 22px 0;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  main {
    margin: 12px auto;
  }

  .panel {
    padding: 17px;
    margin: 14px 0;
    border-radius: 13px;
  }

  h1 {
    font-size: 27px;
  }

  h2 {
    font-size: 17px;
  }

  button {
    width: 100%;
    margin: 5px 0;
  }
}

  <style>
</head>

<body>
<main>
  <h1>Bank Security Lab</h1>
  <p class="muted">Security Monitoring Center</p>

  <section class="panel">
    <h2>1. Credential Security Monitor</h2>
    <p>
      Demonstrates detection of simulated password,
      PIN, OTP and access-token exposure indicators.
    </p>
    <p class="muted">
      Uses fictional examples only. No real credentials
      are requested or collected.
    </p>

    <button id="runTest">Run fictional credential test</button>
    <pre id="results">No test has been run.</pre>
  </section>

  <section class="panel">
    <h2>2. Security Event Analyzer</h2>
    <p>
      Demonstrates rule-based analysis of fictional
      authentication events.
    </p>

    <p class="muted">
      Preview only. Actual server-side analysis requires
      authenticated access to the protected API.
    </p>

    <button id="runEventTest">Analyze fictional events</button>
    <pre id="eventResults">No event analysis has been run.</pre>
  </section>

  <section class="panel">
    <h2>3. Incident Response Center</h2>

    <p>
      Create and track fictional security incidents
      for educational investigation exercises.
    </p>

    <div class="notice">
      Use fictional or sanitized information only.
      Do not enter passwords, PINs, OTPs, access tokens
      or confidential customer information.
    </div>

    <h3>Create incident</h3>

    <form id="incidentForm">
      <label for="incidentTitle">Incident title</label>
      <input
        id="incidentTitle"
        maxlength="100"
        placeholder="Example: Suspicious login activity"
        required
      >

      <label for="incidentSeverity">Severity</label>
      <select id="incidentSeverity" required>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Critical">Critical</option>
      </select>

      <label for="incidentDescription">Incident description</label>
      <textarea
        id="incidentDescription"
        maxlength="1000"
        placeholder="Describe the fictional security incident..."
        required
      ></textarea>

      <button type="submit">Record incident</button>
    </form>

    <hr style="border-color:#354b69">

    <h3>Incident records</h3>
    <p class="muted">
      <span id="incidentCount">0</span> incidents recorded
    </p>

    <div id="incidentList">
      <div class="empty">No incidents recorded yet.</div>
    </div>

    <button id="clearIncidents" class="delete" type="button">
      Clear all incidents
    </button>

    <p class="muted">
      Storage: This browser only. These records are not
      uploaded to the server.
    </p>
  </section>

<section class="panel">
  <h2>4. Incident Report Generator</h2>

  <p>
    Generate a downloadable report of fictional
    security incidents recorded in this browser.
  </p>

  <div class="notice">
    Reports contain only locally recorded fictional
    or sanitized incident information.
  </div>

  <button id="generateReport">
    Generate incident report
  </button>

  <pre id="reportPreview">No report generated yet.</pre>
</section>

<section class="panel">
  <h2>5. Security Analytics Dashboard</h2>

  <p class="muted">
    Statistics calculated from locally recorded fictional incidents.
  </p>

  <div id="analyticsSummary">
    Analytics will appear here.
  </div>

  <h3>Incident severity distribution</h3>
  <div id="severityChart"></div>

  <h3>Incident status distribution</h3>
  <div id="statusChart"></div>

  <button id="refreshAnalytics" type="button">
    Refresh analytics
  </button>
</section>
<section class="panel">
  <h2>6. Incident Activity Timeline</h2>

  <p class="muted">
    Chronological view of locally recorded fictional incidents.
  </p>

  <div id="incidentTimeline">
    No incident activity available.
  </div>

  <button id="refreshTimeline" type="button">
    Refresh timeline
  </button>
</section>
  <section class="panel">
  <h2>7. Registration Validation Test</h2>

  <p>
    Test whether the lab registration endpoint correctly
    rejects invalid registration information.
  </p>

  <div class="notice">
    Fictional test data only. Never enter real passwords,
    PINs, OTPs or personal information.
  </div>

  <label for="testName">Fictional name</label>
  <input id="testName" value="Test User">

  <label for="testEmail">Test email</label>
  <input id="testEmail" value="not-an-email">

  <label for="testPassword">Fictional test password</label>
  <input
    id="testPassword"
    type="password"
    value="FakeTestPassword123!"
  >

  <button id="runRegistrationTest" type="button">
    Test registration validation
  </button>

  <pre id="registrationResults">
No registration test has been run.
  </pre>
</section>
  <section class="panel">
    <h2>System information</h2>
    <p class="status">Dashboard loaded</p>
    <p class="muted">
      Environment: Educational security laboratory
    </p>
    <p class="muted">
      Data mode: Fictional demonstration
    </p>
    <p class="status">System Operational</p>

<p class="muted">System Name: Bank Security Lab</p>
<p class="muted">Environment: Educational Security Laboratory</p>
<p class="muted">Platform: Node.js / Express</p>
<p class="muted">Hosting: Render</p>
<p class="muted">Connection: HTTPS</p>
<p class="muted">Security Monitoring: Demonstration Mode</p>
<p class="muted">Incident Storage: Browser Local Storage</p>
<p class="muted">Credential Monitoring: Fictional Test Data Only</p>
<p class="muted">Last Dashboard Load: <span id="systemLoadTime"></span></p>
  </section>
</main>
document.getElementById("systemLoadTime").textContent =
  new Date().toLocaleString();
<script>
const button = document.getElementById("runTest");
const output = document.getElementById("results");

button.addEventListener("click", () => {
  button.disabled = true;

  const results = [
    {
      category: "Password",
      status: "DETECTED",
      risk: "High",
      detail: "Fictional password exposure indicator"
    },
    {
      category: "PIN",
      status: "DETECTED",
      risk: "High",
      detail: "Fictional PIN exposure indicator"
    },
    {
      category: "OTP",
      status: "DETECTED",
      risk: "High",
      detail: "Fictional OTP exposure indicator"
    },
    {
      category: "Access token",
      status: "DETECTED",
      risk: "High",
      detail: "Fictional token exposure indicator"
    }
  ];

  output.textContent = JSON.stringify({
    message: "Fictional demonstration completed",
    totalFindings: results.length,
    results
  }, null, 2);

  button.disabled = false;
});

const eventButton = document.getElementById("runEventTest");
const eventOutput = document.getElementById("eventResults");

eventButton.addEventListener("click", () => {
  eventButton.disabled = true;

  const events = [
    ...Array.from({ length: 5 }, () => ({
      eventType: "login_failed",
      actorId: "lab-user-001"
    })),
    {
      eventType: "login_success",
      actorId: "lab-user-001"
    },
    ...Array.from({ length: 3 }, () => ({
      eventType: "mfa_failed",
      actorId: "lab-user-002"
    }))
  ];

  const findings = [
    {
      type: "Repeated failed logins",
      severity: "High",
      evidence: "Five fictional failed login events",
      recommendation: "Review authentication activity."
    },
    {
      type: "Login success after repeated failures",
      severity: "Critical",
      evidence: "A fictional successful login followed five failures",
      recommendation: "Verify the login using authorized audit records."
    },
    {
      type: "Repeated MFA failures",
      severity: "High",
      evidence: "Three fictional MFA failures",
      recommendation: "Review MFA alerts and verify the activity."
    }
  ];

  eventOutput.textContent = JSON.stringify({
    message: "Fictional event analysis preview completed",
    analyzedEvents: events.length,
    findingsCount: findings.length,
    findings
  }, null, 2);

  eventButton.disabled = false;
});

// Incident Response Center
const incidentForm = document.getElementById("incidentForm");
const incidentList = document.getElementById("incidentList");
const incidentCount = document.getElementById("incidentCount");
const clearButton = document.getElementById("clearIncidents");

const STORAGE_KEY = "bank_security_lab_incidents";

function loadIncidents() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch {
    return [];
  }
}

let incidents = loadIncidents();

function saveIncidents() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(incidents));
}

function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function renderIncidents() {
  incidentList.replaceChildren();
  incidentCount.textContent = incidents.length;
renderAnalytics();
  renderTimeline();
  if (incidents.length === 0) {
    incidentList.appendChild(
      makeElement("div", "empty", "No incidents recorded yet.")
    );
    return;
  }

  incidents.forEach((incident) => {
    const card = makeElement("article", "incident");

    card.appendChild(makeElement("h3", "", incident.title));

    const description = makeElement("p", "", incident.description);
    card.appendChild(description);

    const meta = makeElement(
      "div",
      "incident-meta",
      "Severity: " + incident.severity +
      "\nStatus: " + incident.status +
      "\nCreated: " + incident.createdAt
    );
    meta.style.whiteSpace = "pre-line";
    card.appendChild(meta);

    const statusLabel = makeElement("label", "", "Update status");
    const statusSelect = document.createElement("select");

    ["Open", "Investigating", "Resolved"].forEach((status) => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });

    statusSelect.value = incident.status;

    statusSelect.addEventListener("change", () => {
      incident.status = statusSelect.value;
      saveIncidents();
      renderIncidents();
    });

    statusLabel.appendChild(statusSelect);
    card.appendChild(statusLabel);

    const deleteButton = makeElement(
      "button",
      "delete",
      "Delete incident"
    );

    deleteButton.type = "button";
    deleteButton.addEventListener("click", () => {
      incidents = incidents.filter(item => item.id !== incident.id);
      saveIncidents();
      renderIncidents();
    });

    card.appendChild(deleteButton);
    incidentList.appendChild(card);
  });
}

incidentForm.addEventListener("submit", (event) => {
  event.preventDefault();

  const title = document.getElementById("incidentTitle").value.trim();
  const severity = document.getElementById("incidentSeverity").value;
  const description = document.getElementById("incidentDescription").value.trim();

  if (!title || !description) return;

 incidents.unshift({
  id: Date.now().toString() + Math.random().toString(16).slice(2),
  title,
  severity,
  description,
  status: "Open",
  createdAt: new Date().toLocaleString(),
  createdAtTimestamp: Date.now()
});

  try {
    saveIncidents();
    incidentForm.reset();
    renderIncidents();
  } catch {
    alert("Could not save the incident in this browser.");
  }
});

clearButton.addEventListener("click", () => {
  if (!confirm("Delete all locally stored fictional incidents?")) return;

  incidents = [];
  saveIncidents();
  renderIncidents();
});

const reportButton = document.getElementById("generateReport");
const reportPreview = document.getElementById("reportPreview");

reportButton.addEventListener("click", () => {
  const counts = {
    Low: 0,
    Medium: 0,
    High: 0,
    Critical: 0
  };

  incidents.forEach(incident => {
    if (Object.prototype.hasOwnProperty.call(counts, incident.severity)) {
      counts[incident.severity]++;
    }
  });

  const lines = [
    "BANK SECURITY LAB",
    "INCIDENT RESPONSE REPORT",
    "================================",
    "",
    "Generated: " + new Date().toLocaleString(),
    "Total incidents: " + incidents.length,
    "",
    "SEVERITY SUMMARY",
    "Low: " + counts.Low,
    "Medium: " + counts.Medium,
    "High: " + counts.High,
    "Critical: " + counts.Critical,
    "",
    "INCIDENT DETAILS",
    "================================"
  ];

  incidents.forEach((incident, index) => {
    lines.push(
      "",
      "Incident #" + (index + 1),
      "Title: " + incident.title,
      "Description: " + incident.description,
      "Severity: " + incident.severity,
      "Status: " + incident.status,
      "Created: " + incident.createdAt
    );
  });

  lines.push(
    "",
    "END OF REPORT",
    "Fictional educational security laboratory."
  );

  const report = lines.join("\n");

  reportPreview.textContent = report;

  const blob = new Blob([report], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "bank-security-incident-report.txt";
  link.click();

  URL.revokeObjectURL(url);
});
function renderAnalytics() {
  const total = incidents.length;

  const severities = ["Low", "Medium", "High", "Critical"];
  const statuses = ["Open", "Investigating", "Resolved"];

  const severityCounts = {};
  const statusCounts = {};

  severities.forEach(level => {
    severityCounts[level] = incidents.filter(
      item => item.severity === level
    ).length;
  });

  statuses.forEach(status => {
    statusCounts[status] = incidents.filter(
      item => item.status === status
    ).length;
  });

  const highCritical =
    severityCounts.High + severityCounts.Critical;

  document.getElementById("analyticsSummary").innerHTML = `
    <p><strong>Total incidents:</strong> ${total}</p>
    <p><strong>High and Critical:</strong> ${highCritical}</p>
    <p><strong>Open:</strong> ${statusCounts.Open}</p>
    <p><strong>Investigating:</strong> ${statusCounts.Investigating}</p>
    <p><strong>Resolved:</strong> ${statusCounts.Resolved}</p>
  `;

  document.getElementById("severityChart").innerHTML =
    severities.map(level => `
      <p>${level}: ${severityCounts[level]}</p>
      <div style="background:#263449;border-radius:8px;height:12px;margin-bottom:12px">
        <div style="background:#27a6ed;width:${total ? severityCounts[level] / total * 100 : 0}%;height:12px;border-radius:8px"></div>
      </div>
    `).join("");

  document.getElementById("statusChart").innerHTML =
    statuses.map(status => `
      <p>${status}: ${statusCounts[status]}</p>
      <div style="background:#263449;border-radius:8px;height:12px;margin-bottom:12px">
        <div style="background:#27a6ed;width:${total ? statusCounts[status] / total * 100 : 0}%;height:12px;border-radius:8px"></div>
      </div>
    `).join("");
}

document.getElementById("refreshAnalytics").addEventListener("click", renderAnalytics);
  function renderTimeline() {
  const timeline = document.getElementById("incidentTimeline");

  if (!timeline) return;

  if (incidents.length === 0) {
    timeline.textContent = "No incident activity available.";
    return;
  }

  const sortedIncidents = [...incidents].sort(
  (a, b) => (b.createdAtTimestamp || 0) - (a.createdAtTimestamp || 0)
);
    

  timeline.replaceChildren();

  sortedIncidents.forEach(incident => {
    const entry = document.createElement("div");
    entry.style.padding = "12px";
    entry.style.marginBottom = "12px";
    entry.style.borderLeft = "3px solid #27a6ed";
    entry.style.background = "#172438";
    entry.style.borderRadius = "8px";

    const title = document.createElement("strong");
    title.textContent = incident.title;

    const details = document.createElement("p");
    details.textContent =
      `Severity: ${incident.severity} | Status: ${incident.status}`;

    const date = document.createElement("small");
    date.textContent = `Created: ${incident.createdAt}`;

    entry.append(title, details, date);
    timeline.appendChild(entry);
  });
}

document.getElementById("refreshTimeline").addEventListener(
  "click",
  renderTimeline
);
renderIncidents();
  // Registration validation test
const registrationButton =
  document.getElementById("runRegistrationTest");

const registrationOutput =
  document.getElementById("registrationResults");

registrationButton.addEventListener("click", async () => {
  registrationButton.disabled = true;
  registrationOutput.textContent = "Testing registration validation...";

  try {
    const response = await fetch("/api/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: "Test User",
        email: "not-an-email",
        password: "FakeTestPassword123!"
      })
    });

    const data = await response.json();

    registrationOutput.textContent = JSON.stringify({
      httpStatus: response.status,
      result: data
    }, null, 2);

  } catch (error) {
    registrationOutput.textContent =
      "Test failed: " + error.message;
  } finally {
    registrationButton.disabled = false;
  }
});
</script>

</body>
</html>
