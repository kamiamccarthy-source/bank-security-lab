
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1425">
  <title>Bank Security Lab | Security Scanner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 22px;
      background: #0b1425;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 850px; margin: auto; }
    h1 { color: #38bdf8; }
    .panel {
      background: #142238;
      border: 1px solid #263b56;
      border-radius: 12px;
      padding: 20px;
      margin: 18px 0;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 7px;
      border: 1px solid #475569;
      background: #0b1425;
      color: white;
      font-size: 15px;
    }
    button {
      padding: 13px 18px;
      background: #0284c7;
      color: white;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .muted { color: #94a3b8; line-height: 1.6; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #08111f;
      padding: 15px;
      border-radius: 8px;
      color: #bae6fd;
      line-height: 1.6;
    }
    a { color: #38bdf8; }
  </style>
</head>
<body>
<div class="container">
  <h1>Bank Security Lab</h1>
  <p class="muted">Website Security Scanner</p>

  <div class="panel">
    <h2>Authorized Website Test</h2>
    <p class="muted">
      This scanner is restricted to your own Bank Security Lab deployment.
      It checks publicly returned HTTP security headers only.
    </p>

    <label for="target">Website URL</label>
    <input id="target"
      value="https://bank-security-lab.onrender.com"
      readonly>

    <button id="scanButton" type="button">Run Security Check</button>
  </div>

  <div class="panel">
    <h2>Scan Results</h2>
    <pre id="results">Waiting for security check...</pre>
  </div>

  <p><a href="/">← Return to Security Dashboard</a></p>
</div>

<script>
const button = document.getElementById("scanButton");
const output = document.getElementById("results");

button.addEventListener("click", async () => {
  button.disabled = true;
  output.textContent = "Checking your website...";

  try {
    const response = await fetch(
      "https://bank-security-lab.onrender.com/",
      { method: "GET", cache: "no-store" }
    );

    const headers = response.headers;
    const checks = [
      ["Strict-Transport-Security", "HSTS"],
      ["Content-Security-Policy", "Content Security Policy"],
      ["X-Frame-Options", "Clickjacking Protection"],
      ["X-Content-Type-Options", "MIME Sniffing Protection"],
      ["Referrer-Policy", "Referrer Policy"],
      ["Permissions-Policy", "Permissions Policy"]
    ];

    const results = checks.map(([header, label]) => ({
      check: label,
      status: headers.get(header) ? "PRESENT" : "NOT EXPOSED",
      value: headers.get(header) || "Header not visible to this browser"
    }));

    output.textContent = JSON.stringify({
      target: "https://bank-security-lab.onrender.com/",
      httpStatus: response.status,
      scanType: "Public HTTP response header check",
      results
    }, null, 2);

  } catch (error) {
    output.textContent =
      "Browser could not complete the check.\n" +
      "Possible cause: cross-origin browser restrictions.\n\n" +
      error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
